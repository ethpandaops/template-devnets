[project]
name = "template-devnets"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
  "ansible==14.6.0",
  "ansible-lint==26.11.0",
  # eMudhra/emSign CA compromise: older certifi still trusts the bad roots.
  "certifi>=2026.10.23",
  "molecule==26.11.0",
  "molecule-containers==2.0.0",
  "netaddr==1.3.0",
]

[tool.uv]
# Not a Python package: only the venv is managed.
package = false
# uv < 0.13.10 embeds the compromised eMudhra/emSign C1/C3 roots in its own trust store.
required-version = ">=0.13.10"
