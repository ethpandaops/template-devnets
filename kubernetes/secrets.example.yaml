# The keys kubernetes/secrets.sops.yaml holds for this class's charts. Copy this
# file to kubernetes/secrets.sops.yaml, rename template-devnets to
# <class>-devnets, fill in the values, then encrypt it in place:
#   sops -e -i kubernetes/secrets.sops.yaml
# The faucet, assertoor and spamoor keys are hex private keys of funded genesis
# accounts. node_ingress is the basic auth in front of the devnet's nodes
# (secret_nginx_shared_basic_auth in ansible); combined is username:password.
ethereum:
  testnets:
    template-devnets:
      assertoor_private_key: ""
      blockscout_secret_key_base: ""
      faucet_private_key: ""
      faucet_2_private_key: ""
      faucet_agents_private_key: ""
      faucet_agents_rest_private_key: ""
      spamoor_private_key: ""
      node_ingress:
        username: ""
        password: ""
        combined: ""
