[defaults]
stdout_callback      = default
callback_result_format = yaml
inventory            = inventories/devnet-0/inventory.ini
roles_path           = vendor/roles/:roles
collections_path     = vendor/collections
forks                = 100
timeout              = 60
retry_files_enabled  = False
host_key_checking    = False
vars_plugins_enabled = host_group_vars,community.sops.sops
vars_plugin_stage    = inventory
strategy             = mitogen_free
# Stub that re-exports mitogen's strategy from the venv (no site-packages path to keep in sync).
strategy_plugins     = plugins/strategy

# Persist facts locally so that they can be used within multiple runs
fact_caching            = jsonfile
# Keep facts forever
fact_caching_timeout    = 0
# Where to store the fact cache
fact_caching_connection = tmp/devnet-0/

[inventory]
enable_plugins = script, yaml, ini

[ssh_connection]
ssh_args   = -o ForwardAgent=yes -o ControlMaster=auto -o ControlPersist=60s
pipelining = true

[mitogen]
# The connection pool size is not configurable here: mitogen reads only the
# MITOGEN_POOL_SIZE env var (default 32). ../.envrc sets it to match forks;
# without direnv, prefix the run with MITOGEN_POOL_SIZE=100.

# Optional: Use fork isolation for better module compatibility (default is fork)
# mitogen_task_isolation = fork
