# Services of the devnet's service cluster: which run, their settings, and who
# may use them. Read by the role ethpandaops.general.generate_kubernetes_config.

# Services that are not deployed. Everything else the role knows is.
gen_kubernetes_config_disabled_services: []

gen_kubernetes_config_dora_execution_snooper_port: 8961
gen_kubernetes_config_dora_frontend_rainbowkit_id: "15fe4ab4d5c0bcb6f0dc7c398301ff0e"
gen_kubernetes_config_dora_execution_endpoints_url: "https://raw.githubusercontent.com/ethpandaops/{{ devnet_name }}-devnets/refs/heads/master/kubernetes/{{ network_iteration }}/dora/endpoints-el.yaml"
gen_kubernetes_config_dora_consensus_endpoints_url: "https://raw.githubusercontent.com/ethpandaops/{{ devnet_name }}-devnets/refs/heads/master/kubernetes/{{ network_iteration }}/dora/endpoints-cl.yaml"
gen_kubernetes_config_dora_api_secret: "{{ secret_dora_api_key }}"
# Dora block-arrival views from the per-devnet xatu databases.
gen_kubernetes_config_dora_xatu_enabled: true

# Access control (authenticatoor): who may use which service. The doors are
# "authentik" (the central IdP, where teams come from) and "cfaccess"
# (Cloudflare Access). A member is <door>/team:<team>, <door>/user:<id> or
# <door>/<attribute>:<value>; a service is <name>, <name>:<feature>,
# <name>:<prefix>* or all:all. A login that no group names gets no token.
gen_kubernetes_config_authenticatoor_grants:
  # Staff: the ethpandaops team, and everyone and every service token that
  # passes Cloudflare Access.
  - name: staff
    members:
      - "authentik/team:ethpandaops"
      - "cfaccess/principal:user"
      - "cfaccess/principal:service"
    services: ["all:all"]
  # Core devs: everyone the IdP lets in (its panda-access group), whatever
  # their team. The faucet with its login perks; faucet:drop_100eth would add
  # the free 100 ETH drop per day.
  - name: core-devs
    members:
      - "authentik/groups:panda-access"
    services: ["faucet:drop_100eth"]
  # - name: client-teams
  #   members:
  #     - "authentik/team:lighthouse"
  #     - "authentik/team:geth"
  #   services: [spamoor, assertoor]
