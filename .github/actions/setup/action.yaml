name: Install deps
description: Install deps
runs:
  using: composite
  steps:
    - name: Install asdf
      uses: asdf-vm/actions/setup@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

    - name: Install tools, .venv and ansible/vendor
      shell: bash
      run: ./setup.sh

    - name: Put the uv venv on PATH
      shell: bash
      run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
